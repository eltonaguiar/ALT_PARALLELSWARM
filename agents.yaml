# Roster for the SNC_DISC_RESEARCH parallel pass.
# Each entry gets its own git worktree + branch + folder named <model>__<provider>__<harness>.

task: SNC_DISC_RESEARCH
max_parallel: 3
rounds: 3

agents:
  # --- my own run (this agent) --------------------------------------------------
  - id: nemotron-3-5-super-vl__kilo__kilocode
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    provider: kilo
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    wt: 5
    note: "Kilo agent running nemotron-3.5-super-vl via the Kilo Gateway / NVIDIA NIM"

  # --- my own run (the agent writing this repo) --------------------------------
  - id: deepseek-v4-flash__deepseek__hermes
    model: deepseek-v4-flash
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    wt: 1
    note: "Hermes CLI agent's own attempt (orchestrator + author of this repo)"

  # --- locally served models, same harness -------------------------------------
  - id: qwen2.5-7b__ollama__hermes
    model: qwen2.5:7b-instruct-q5_K_M
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 2
    note: "small local model; known to emit malformed tool calls"

  - id: llama3.1-8b__ollama__hermes
    model: llama3.1:8b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 3
    note: "small local model, different lineage (may hallucinate less / follow format better)"

  - id: qwen3-30b-a3b__ollama__hermes
    model: qwen3:30b-a3b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 4
    note: "largest local model in the pool; MoE so it is usable on this box"

# ---------------------------------------------------------------------------
# Self-driven runs: an agent that used its OWN tools (no API dispatch), so
# orchestrate.py must not re-run it. Read by humans, ignored by the orchestrator.
self_runs:
  - id: deepseek-v4.1-flash-fast__freebuff__buffy
    model: deepseek-v4.1-flash-fast   # reported as "DeepSeek V4.1 Flash Fast"
    provider: freebuff               # Freebuff / Codebuff agent runtime (Buffy)
    harness: buffy-native            # web_search + read_url, no local browser
    wt: 1
    folder: agents/deepseek-v4.1-flash-fast__freebuff__buffy/SNC_DISC__WT1
    note: "browsed and researched with native tools; no vendor key, no budget.py entry"
  - id: inkling-2-small__openrouter__kilo
    model: thinkingmachines/inkling-2-small:free
    provider: openrouter             # OpenRouter free tier (kilo harness)
    harness: kilo
    wt: 1
    folder: agents/inkling-2-small__openrouter__kilo/SNC_DISC__WT1
    note: "self-driven Kilo run; Fluid Topics khub-API corpus; swarm/ wrapper incl. SUBQ (unkeyed) — not re-runnable by orchestrate.py"
