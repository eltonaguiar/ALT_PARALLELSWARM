# Roster for the SNC_DISC_RESEARCH parallel pass.
# Each entry gets its own git worktree + branch + folder named <model>__<provider>__<harness>.

task: SNC_DISC_RESEARCH
max_parallel: 3
rounds: 3

agents:
  # --- my own run (this agent) --------------------------------------------------
  - id: nemotron-3-5-super-vl__kilo__kilocode
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    provider: kilo
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    wt: 5
    note: "Kilo agent running nemotron-3.5-super-vl via the Kilo Gateway / NVIDIA NIM"

  # --- my own run (the agent writing this repo) --------------------------------
  - id: deepseek-v4-flash__deepseek__hermes
    model: deepseek-v4-flash
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    wt: 1
    note: "Hermes CLI agent's own attempt (orchestrator + author of this repo)"

  # --- locally served models, same harness -------------------------------------
  - id: qwen2.5-7b__ollama__hermes
    model: qwen2.5:7b-instruct-q5_K_M
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 2
    note: "small local model; known to emit malformed tool calls"

  - id: llama3.1-8b__ollama__hermes
    model: llama3.1:8b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 3
    note: "small local model, different lineage (may hallucinate less / follow format better)"

  - id: qwen3-30b-a3b__ollama__hermes
    model: qwen3:30b-a3b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key_env: ""
    wt: 4
    note: "largest local model in the pool; MoE so it is usable on this box"

# ---------------------------------------------------------------------------
# Self-driven runs: an agent that used its OWN tools (no API dispatch), so
# orchestrate.py must not re-run it. Read by humans, ignored by the orchestrator.
self_runs:
  - id: deepseek-v4.1-flash-fast__freebuff__buffy
    model: deepseek-v4.1-flash-fast   # reported as "DeepSeek V4.1 Flash Fast"
    provider: freebuff               # Freebuff / Codebuff agent runtime (Buffy)
    harness: buffy-native            # web_search + read_url, no local browser
    wt: 1
    folder: agents/deepseek-v4.1-flash-fast__freebuff__buffy/SNC_DISC__WT1
    note: "browsed and researched with native tools; no vendor key, no budget.py entry"
  - id: inkling-2-small__openrouter__kilo
    model: thinkingmachines/inkling-2-small:free
    provider: openrouter             # OpenRouter free tier (kilo harness)
    harness: kilo
    wt: 1
    folder: agents/inkling-2-small__openrouter__kilo/SNC_DISC__WT1
    note: "self-driven Kilo run; Fluid Topics khub-API corpus; swarm/ wrapper incl. SUBQ (unkeyed) — not re-runnable by orchestrate.py"

  - id: deepseek-v4-pro__deepseek__kilo
    model: deepseek-v4-pro
    provider: deepseek
    harness: kilo
    wt: 1
    folder: agents/deepseek-v4-pro__deepseek__kilo/SNC_DISC__WT1
    note: "Kilo agent driving own tools (webfetch + ServiceNowDocs GitHub mirror); added shared/free_api_registry.py; orchestrated 3 local Ollama models via agents_kilo_local.yaml"

  - id: deepseek-flash__openrouter__kilo-cli
    model: deepseek/deepseek-flash
    provider: openrouter           # inferred from model-ID namespace + OPENROUTER env
    harness: kilo
    wt: 1
    folder: agents/deepseek-flash__openrouter__kilo-cli/SNC_DISC__WT1
    note: "Self-driven via Kilo native tools + ServiceNow khub JSON API; then dispatched 3 workers (qwen3.5:4b, qwen2.5-coder:7b, particle-1:free) through its own worktree/budget harness. See agents/.../swarm/ORCHESTRATION.md"

# Dispatched by the run above; not re-runnable by orchestrate.py (they used the
# agent-local swarm harness, not shared/orchestrate.py). Kept for provenance.
alt_swarm_workers:
  - id: qwen3.5-4b__ollama__alt-swarm
    model: qwen3.5:4b
    provider: ollama
    harness: alt-swarm
    wt: 2
    folder: agents/qwen3.5-4b__ollama__alt-swarm/SNC_DISC__WT2
  - id: qwen2.5-coder-7b__ollama__alt-swarm
    model: qwen2.5-coder:7b
    provider: ollama
    harness: alt-swarm
    wt: 3
    folder: agents/qwen2.5-coder-7b__ollama__alt-swarm/SNC_DISC__WT3
  - id: particle-1__openrouter__alt-swarm
    model: particle-ai/particle-1:free
    provider: openrouter
    harness: alt-swarm
    wt: 4
    folder: agents/particle-1__openrouter__alt-swarm/SNC_DISC__WT4
